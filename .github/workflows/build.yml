name: Compilar APK

# - Todo envio para a main: gera o APK e atualiza a versão "teste" na página de Releases
#   (download direto do .apk pelo celular).
# - Tag v0.2.0, v0.3.0...: gera uma versão oficial. É ela que o botão
#   "Procurar atualização" do app encontra.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Avisar se falta a chave do Maps
        if: env.MAPS_API_KEY == ''
        run: echo "::warning::Segredo MAPS_API_KEY não configurado. O app compila, mas o mapa vai aparecer cinza."

      - name: Compilar
        run: |
          echo "::add-matcher::.github/kotlin-matcher.json"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="barroca-maps-${GITHUB_REF_NAME}.apk"; else NAME="barroca-maps-teste.apk"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: barroca-maps-apk
          path: ${{ env.APK }}

      - name: Atualizar versão de teste
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --cleanup-tag -y || true
          gh release create teste "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Versão de teste (última alteração)" \
            --notes "Compilada automaticamente do commit ${GITHUB_SHA::7}. Baixe o arquivo barroca-maps-teste.apk e instale no celular."

      - name: Publicar versão oficial
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Barroca Maps ${GITHUB_REF_NAME#v}" --generate-notes
